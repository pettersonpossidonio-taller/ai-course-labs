[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "final-project-ai-code-review-bot-backend"
version = "0.1.0"
description = "AI-powered code review bot backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "openai>=1.40,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

